<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بەڕێوبەرایەتی کاڤی ئەکسچەین</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>

<div class="admin-container">
    <div class="top-bar">
        <h2>بەڕێوبەرایەتی نرخەکان</h2>
        <button class="btn-create">CREATE +</button>
    </div>

    <table class="admin-table">
        <thead>
            <tr>
                <th>#</th>
                <th>ناوی دراو</th>
                <th>کڕین (BUY)</th>
                <th>فرۆشتن (SALE)</th>
                <th>کردارەکان</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>دۆلار</td>
                <td>154,850</td>
                <td>155,050</td>
                <td>
                    <button class="btn-edit">✎ گۆڕین</button>
                    <button class="btn-delete">🗑 سڕینەوە</button>
                </td>
            </tr>
            <tr>
                <td>2</td>
                <td>یۆرۆ</td>
                <td>116</td>
                <td>117.25</td>
                <td>
                    <button class="btn-edit">✎ گۆڕین</button>
                    <button class="btn-delete">🗑 سڕینەوە</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "kavi-exchange.firebaseapp.com",
  projectId: "kavi-exchange",
  storageBucket: "kavi-exchange.firebasestorage.app",
  messagingSenderId: "48958701096",
  appId: "1:48958701096:web:312bd94a3809dab0cabf1d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadPrices() {

  const usdDoc = await getDoc(doc(db, "prices", "USD"));

  if (usdDoc.exists()) {
    const data = usdDoc.data();

    document.querySelector(".usd-buy").innerText = data.buy;
    document.querySelector(".usd-sale").innerText = data.sale;
  }
}

loadPrices();
</script>

</body>
</html>
